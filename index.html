<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#080A06" />
    <meta name="description" content="WABOS is a WhatsApp operating system for small businesses. It qualifies leads, books jobs, takes payments and sends invoices inside the WhatsApp you already use." />

    <!--
      Link previews. These static tags are the ONLY thing WhatsApp, Facebook
      and LinkedIn read: their crawlers do not run JavaScript, so nothing
      react-helmet sets ever reaches a preview. Until 2026-10-05 the image
      here was picsum.photos?random=1, which redirects to a DIFFERENT
      stranger's stock photo on every request, under a description selling
      to "rental agencies". For a business that sells over WhatsApp, this
      preview is the shop window.

      The card is public/og-card.png, built from docs/brand/og-card.html.
      Absolute URLs, because a crawler resolves nothing relative. No price
      anywhere here: prices are served by /api/products, and a price typed
      into a meta tag is the first copy to go stale.
    -->
    <meta property="og:title" content="WABOS by Easy Branding AI" />
    <meta property="og:description" content="WABOS is a WhatsApp operating system for small businesses. It qualifies leads, books jobs, takes payments and sends invoices inside the WhatsApp you already use." />
    <meta property="og:url" content="https://easybranding.co.za/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Easy Branding AI" />
    <meta property="og:image" content="https://easybranding.co.za/og-card.png" />
    <meta property="og:image:secure_url" content="https://easybranding.co.za/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Easy Branding AI. WABOS, a WhatsApp operating system for small businesses." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WABOS by Easy Branding AI" />
    <meta name="twitter:description" content="WABOS is a WhatsApp operating system for small businesses. It qualifies leads, books jobs, takes payments and sends invoices inside the WhatsApp you already use." />
    <meta name="twitter:image" content="https://easybranding.co.za/og-card.png" />

    <title>WABOS by Easy Branding AI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
      body { 
        background: #080A06; 
        color: #EEF0E8; 
        font-family: 'Outfit', system-ui, sans-serif;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }
      input, button, select, textarea { 
        font-family: inherit; 
        font-size: inherit;
      }
      img { max-width: 100%; height: auto; }
      a { color: inherit; }
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: #080A06; }
      ::-webkit-scrollbar-thumb { background: #4A6741; border-radius: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
