name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking since 2026-10-05, when lint reached zero problems. It was
      # informational before that, because 47 pre-existing problems would have
      # kept every check red; as informational it grew to 53, and several of
      # those were real bugs. `npm run lint` fails on warnings as well, so the
      # count cannot creep back up one warning at a time. Runs before the tests
      # so a lint failure is reported in seconds.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
